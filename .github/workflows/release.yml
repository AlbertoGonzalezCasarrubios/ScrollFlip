name: Release

# Push a tag like v1.0.0 to build, test and publish a GitHub release.
# The tag must match CFBundleShortVersionString in Resources/Info.plist.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches Info.plist
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          if [[ "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Info.plist version $VERSION"
            exit 1
          fi

      - name: Run tests
        run: bash scripts/test.sh

      - name: Build and zip
        run: bash build.sh zip

      - name: Compose release notes
        run: |
          # This version's section of CHANGELOG.md, followed by the install instructions.
          awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = ($2 == v)} p' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"
            exit 1
          fi
          echo >> notes.md
          cat .github/release-notes.md >> notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/ScrollFlip.zip \
            --title "ScrollFlip $GITHUB_REF_NAME" \
            --notes-file notes.md
